[project]
name = "sentinel-shield"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FediJlassi", email = "fedi.jlassi@supcom.tn" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "uvicorn[standard]>=0.53.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]